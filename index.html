<style>

/* Acabado premium: botones con relieve, profundidad suave y foco visible */
.btn{border-radius:10px;padding:10px 17px;letter-spacing:.005em;box-shadow:0 1px 2px rgba(16,20,30,.07),inset 0 1px 0 color-mix(in srgb,#fff 18%,transparent);transition:transform .12s,box-shadow .18s,border-color .18s,background .18s}

.card,.kpi{border-radius:16px;box-shadow:0 1px 2px rgba(16,20,30,.04),0 14px 28px -20px rgba(16,20,30,.28)}

th{background:color-mix(in srgb,var(--surface2) 55%,transparent)}
tbody tr{transition:background .12s}tbody tr:hover{background:color-mix(in srgb,var(--surface2) 55%,transparent)}
input,select,textarea{border-radius:10px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);outline:none}

.qty button{transition:border-color .15s}.qty button:hover{border-color:var(--accent)}
.modal{backdrop-filter:blur(6px)}
.sheet{border-radius:18px;border:1px solid var(--line);box-shadow:0 34px 70px -24px rgba(0,0,0,.55)}
.bell{box-shadow:0 8px 18px -10px rgba(16,20,30,.45);transition:transform .12s}.bell:hover{transform:translateY(-1px)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tkp{background:#fff;color:#000;font:12px/1.35 "Courier New",monospace;margin:0 auto;box-shadow:0 12px 28px -14px rgba(0,0,0,.45);max-width:100%}
.tkp .t{padding:3mm}.tkp .c{text-align:center}.tkp .b{font-weight:700}.tkp .big{font-size:14px}.tkp .r{display:flex;justify-content:space-between;gap:6px}.tkp hr{border:0;border-top:1px dashed #000;margin:6px 0}
@media (max-width:900px){
.app{grid-template-columns:1fr}

<script>
"use strict";
const COLS=["products","sales","repairs","moves"];
const S={products:{},sales:{},repairs:{},moves:{},settings:{}};
const DEF={name:"Mi Taller",phone:"",address:"",ruc:"",tax:0,next:1,nextRep:1,footer:"Gracias por su preferencia. Garantía de reparación: 30 días.",lowDefault:3,paper:"80",logo:""};
let DB=null,mode="local",view="panel",ui={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cfg=()=>({...DEF,...S.settings});
const money=n=>"C$ "+(Number(n)||0).toLocaleString("es-NI",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const fdate=iso=>new Date(iso).toLocaleString("es-NI",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const list=c=>Object.entries(S[c]).map(([id,v])=>({...v,id}));
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function updNet(){const n=$("#syncNote");if(!n)return;n.textContent=mode==="db"?(navigator.onLine?"Datos guardados en la nube.":"Sin conexión con la nube."):(navigator.onLine?"Funciona sin internet. Datos en este dispositivo.":"Sin internet · todo se guarda en este dispositivo.")}
function saveLocal(){try{localStorage.setItem("tallerpro",JSON.stringify(S))}catch(e){toast("No hay espacio para guardar. Descarga un respaldo en Ajustes.")}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem("tallerpro")||"null");if(d)COLS.concat("settings").forEach(c=>{if(d[c])S[c]=d[c]})}catch(e){}}
async function put(col,id,data){
  S[col][id]=data;
  if(DB){try{await DB.collection(col).doc(id).set(data)}catch(e){toast("No se pudo guardar: "+(e.code||"error"))}}else saveLocal();
}
async function del(col,id){
  delete S[col][id];
  if(DB){try{await DB.collection(col).doc(id).delete()}catch(e){toast("No se pudo borrar")}}else saveLocal();
}
async function putSettings(patch){
  S.settings={...S.settings,...patch};
  if(DB){try{await DB.doc("config/main").set(S.settings)}catch(e){toast("No se pudo guardar ajustes")}}else saveLocal();
}
async function initStore(){
  loadLocal();
  try{DB=window.claude?await window.claude.use("db"):null}catch(e){DB=null}
  if(!DB){updNet();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}return}
  mode="db";S.products={};S.sales={};S.repairs={};S.moves={};S.settings={};
  updNet();
  const t=setTimeout(()=>$("#syncNote").textContent="Sin conexión con la base de datos.",10000);
  COLS.forEach(c=>DB.collection(c).onSnapshot(sn=>{clearTimeout(t);S[c]={};sn.docs.forEach(d=>S[c][d.id]=d.data());render()},e=>toast("Error de datos: "+e.code)));
  DB.doc("config/main").onSnapshot(d=>{S.settings=d.exists?d.data():{};render()},()=>{});
}
function openModal(html){$("#sheet").innerHTML=html;$("#modal").hidden=false}
function closeModal(){$("#modal").hidden=true;$("#sheet").innerHTML=""}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
addEventListener("offline",()=>{updNet();toast("Sin internet: sigues trabajando, todo se guarda")});
addEventListener("online",()=>{updNet();toast("Conexión recuperada")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
</script>
<script>
async function adjustStock(pid,delta,type,ref){
  const p=S.products[pid];if(!p)return;
  const after=Math.max(0,(Number(p.stock)||0)+delta);
  await put("products",pid,{...p,stock:after});
  await put("moves",uid(),{ts:new Date().toISOString(),pid,name:p.name,type,qty:delta,after,ref:ref||""});
}
const stState=p=>p.stock<=0?["bad","Agotado"]:p.stock<=(Number(p.min)||0)?["warn","Stock bajo"]:["good","Disponible"];
function vInv(){
  const q=(ui.iq||"").toLowerCase(),f=ui.ifilter||"all";
  let ps=list("products").filter(p=>(!q||(p.name+" "+(p.sku||"")+" "+(p.category||"")).toLowerCase().includes(q)));
  if(f==="low")ps=ps.filter(p=>p.stock>0&&p.stock<=(Number(p.min)||0));
  if(f==="out")ps=ps.filter(p=>p.stock<=0);
  ps.sort((a,b)=>a.name.localeCompare(b.name));
  const all=list("products");
  const val=all.reduce((s,p)=>s+p.stock*p.cost,0),retail=all.reduce((s,p)=>s+p.stock*p.price,0);
  const units=all.reduce((s,p)=>s+p.stock,0);

<script>
const RST=["Recibido","En diagnóstico","En reparación","Listo","Entregado"];
const rCls=s=>({Recibido:"mut","En diagnóstico":"warn","En reparación":"warn",Listo:"good",Entregado:"mut"}[s]);
const repTotal=r=>(+r.labor||0)+(r.parts||[]).reduce((s,p)=>s+p.qty*p.price,0);
function vRep(){
  const f=ui.rf||"act",q=(ui.rq||"").toLowerCase();
  let rs=list("repairs").sort((a,b)=>b.ts.localeCompare(a.ts)).filter(r=>(!q||(r.num+" "+r.customer.name+" "+r.device+" "+(r.imei||"")).toLowerCase().includes(q)));

  ${rs.map(r=>`<tr><td class="mono">${esc(r.num)}<div class="note">${fdate(r.ts)}</div></td><td><b>${esc(r.device)}</b><div class="note">${esc(r.issue)}</div></td><td>${esc(r.customer.name)}<div class="note">${esc(r.customer.phone)}</div></td><td><span class="pill ${rCls(r.status)}">${r.status}</span></td><td class="n">${money(repTotal(r))}</td><td class="n">${money(Math.max(0,repTotal(r)-(+r.deposit||0)))}</td><td class="n"><button class="btn s" data-act="editr" data-id="${r.id}">Abrir</button></td></tr>`).join("")||`<tr><td colspan="7" class="empty">No hay reparaciones en esta vista.</td></tr>`}</tbody></table></div></div>`;
}
function repForm(id){
  const r=id?S.repairs[id]:{customer:{},parts:[],status:"Recibido"};

  <div class="f"><div><label for="rn">Cliente</label><input id="rn" required value="${esc(r.customer.name||"")}"></div><div><label for="rp">Teléfono</label><input id="rp" inputmode="tel" value="${esc(r.customer.phone||"")}"></div>
  <div><label for="rd">Equipo (marca y modelo)</label><input id="rd" required value="${esc(r.device||"")}"></div><div><label for="ri">IMEI / serie</label><input id="ri" value="${esc(r.imei||"")}"></div></div>
  <div><label for="ra">Falla reportada</label><textarea id="ra" rows="2" required>${esc(r.issue||"")}</textarea></div>
  <div class="f"><div><label for="rl">Mano de obra (C$)</label><input id="rl" type="number" min="0" step="0.01" value="${r.labor??""}"></div><div><label for="rdp">Anticipo (C$)</label><input id="rdp" type="number" min="0" step="0.01" value="${r.deposit??""}"></div>
  <div><label for="rs">Estado</label><select id="rs">${RST.map(s=>`<option ${s===r.status?"selected":""}>${s}</option>`).join("")}</select></div></div>
  ${id?`<div class="card" style="background:var(--surface2);border:0"><h2>Repuestos usados</h2>${(r.parts||[]).map((p,i)=>`<div class="cart-line"><div>${esc(p.name)} × ${p.qty}</div><div>${money(p.qty*p.price)}</div><button type="button" class="btn s d" data-act="rmpart" data-id="${id}" data-i="${i}">Devolver</button></div>`).join("")||`<div class="note">Sin repuestos todavía.</div>`}
  <div class="row" style="margin-top:10px"><select id="pp" style="flex:2;min-width:160px"><option value="">Elegir repuesto del inventario…</option>${avail.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.stock}) · ${money(p.price)}</option>`).join("")}</select><input id="pq2" type="number" min="1" value="1" style="width:80px"><button type="button" class="btn" data-act="addpart" data-id="${id}">Agregar</button></div></div>
  <div class="tot big"><span>Total</span><span>${money(repTotal(r))}</span></div>`:`<p class="note">Guarda la orden para agregar repuestos del inventario.</p>`}
  <div class="row" style="justify-content:space-between"><div class="row">${id&&r.saleId?`<button type="button" class="btn" data-act="seeinv" data-id="${r.saleId}">Ver factura</button>`:id?`<button type="button" class="btn" data-act="billr" data-id="${id}">Generar factura</button>`:""}</div>
  <div class="row"><button type="button" class="btn" data-act="close">Cerrar</button><button class="btn p">Guardar</button></div></div></form>`);
  $("#rf").onsubmit=async e=>{e.preventDefault();syncRep();

function syncRep(){ui.rdraft={customer:{name:$("#rn").value.trim(),phone:$("#rp").value.trim()},device:$("#rd").value.trim(),imei:$("#ri").value.trim(),issue:$("#ra").value.trim(),labor:+$("#rl").value||0,deposit:+$("#rdp").value||0,status:$("#rs").value}}
async function addPart(id){
  const pid=$("#pp").value,qty=parseInt($("#pq2").value)||1,p=S.products[pid];
  if(!p){toast("Elige un repuesto");return}
  if(p.stock<qty){toast("Solo quedan "+p.stock);return}
  syncRep();const r=S.repairs[id];
  await put("repairs",id,{...r,...ui.rdraft,parts:[...(r.parts||[]),{pid,name:p.name,qty,price:p.price,cost:p.cost}]});
  await adjustStock(pid,-qty,"repuesto","Orden "+r.num);repForm(id);
}
async function rmPart(id,i){
  syncRep();const r=S.repairs[id],p=r.parts[i];
  await put("repairs",id,{...r,...ui.rdraft,parts:r.parts.filter((_,k)=>k!==i)});
  if(S.products[p.pid])await adjustStock(p.pid,p.qty,"anulacion","Devuelto de orden "+r.num);repForm(id);
}
async function billRepair(id){
  syncRep();const r={...S.repairs[id],...ui.rdraft},c=cfg();
  const items=[...(r.labor?[{name:"Mano de obra: "+r.device,qty:1,price:r.labor,cost:0}]:[]),...(r.parts||[]).map(p=>({name:p.name,qty:p.qty,price:p.price,cost:p.cost}))];
  if(!items.length){toast("Agrega mano de obra o repuestos");return}
  const sub=items.reduce((s,l)=>s+l.qty*l.price,0),tax=sub*(+c.tax||0)/100,sid=uid(),num="F-"+String(c.next).padStart(4,"0");
  await putSettings({next:c.next+1});
  await put("sales",sid,{num,ts:new Date().toISOString(),customer:{...r.customer},method:"Efectivo",items,subtotal:sub,discount:0,taxRate:+c.tax||0,tax,total:sub+tax,status:"emitida",repairNum:r.num});
  await put("repairs",id,{...r,saleId:sid,status:r.status==="Listo"?"Entregado":r.status});closeModal();toast("Factura generada");showInvoice(sid);
}
</script>
<script>
function totBox(){const t=cartTotals(),c=cfg();return `<div class="tot"><span>Subtotal</span><span>${money(t.sub)}</span></div>${t.disc?`<div class="tot"><span>Descuento</span><span>− ${money(t.disc)}</span></div>`:""}${+c.tax?`<div class="tot"><span>IVA ${c.tax}%</span><span>${money(t.tax)}</span></div>`:""}<div class="tot big"><span>Total</span><span>${money(t.total)}</span></div>`}
function vPanel(){

  const day=ok.filter(s=>s.ts.slice(0,10)===d0),mon=ok.filter(s=>s.ts.slice(0,7)===m0);

  const top={};mon.forEach(s=>s.items.forEach(l=>{if(l.pid){top[l.name]=(top[l.name]||0)+l.qty}}));

  <div class="grid kpis"><div class="kpi"><span>Ventas de hoy</span><b>${money(day.reduce((s,x)=>s+x.total,0))}</b><em>${day.length} facturas</em></div>
  <div class="kpi"><span>Ventas del mes</span><b>${money(mon.reduce((s,x)=>s+x.total,0))}</b><em>${mon.length} facturas</em></div>
  <div class="kpi"><span>Ganancia del mes</span><b>${money(profit)}</b><em>Precio menos costo de lo vendido</em></div>
  <div class="kpi"><span>Equipos en taller</span><b>${act}</b><em>${ready} listos para entregar</em></div></div>
  <div class="grid two"><div class="card"><h2>Últimas ventas</h2><div class="tw"><table><tbody>${rec.map(s=>`<tr><td class="mono">${esc(s.num)}</td><td>${esc(s.customer.name)}<div class="note">${fdate(s.ts)}</div></td><td class="n"><b>${money(s.total)}</b></td></tr>`).join("")||`<tr><td class="empty">Todavía no hay ventas.</td></tr>`}</tbody></table></div></div>
  <div class="grid"><div class="card"><h2>Por reponer</h2>${low.map(p=>`<div class="tot"><span>${esc(p.name)}</span><span class="pill ${p.stock<=0?"bad":"warn"}">${p.stock} en existencia</span></div>`).join("")||`<div class="note">Todo el inventario está sobre el mínimo.</div>`}</div>
  <div class="card"><h2>Más vendidos del mes</h2>${tops.map(([n,q])=>`<div class="tot"><span>${esc(n)}</span><b>${q} u.</b></div>`).join("")||`<div class="note">Aparecerán cuando registres ventas.</div>`}</div></div></div>`;
}
function vAj(){
  const c=cfg();
  return `<div class="top"><div><h1>Ajustes</h1><p>Datos que salen impresos en tus facturas.</p></div></div>
  <div class="card"><form id="af" class="grid"><div class="f"><div><label for="an">Nombre del negocio</label><input id="an" value="${esc(c.name)}"></div><div><label for="aph">Teléfono</label><input id="aph" value="${esc(c.phone)}"></div><div><label for="ar">RUC (opcional)</label><input id="ar" value="${esc(c.ruc)}"></div></div>
  <div><label for="aa">Dirección</label><input id="aa" value="${esc(c.address)}"></div>
  <div class="f"><div><label for="alg">Logo del negocio</label><div class="row"><img id="logoPrev" alt="Logo" src="${c.logo||""}" style="height:52px;max-width:120px;border-radius:6px;border:1px solid var(--line);background:#fff;${c.logo?"":"display:none"}"><input id="alg" type="file" accept="image/*" style="flex:1;min-width:150px">${c.logo?`<button type="button" class="btn s d" data-act="rmlogo">Quitar</button>`:""}</div><div class="note" style="margin-top:4px">Aparece en facturas y tickets. Se ajusta solo a un tamaño liviano.</div></div>
  <div><label for="apw">Ancho del papel del ticket</label><select id="apw"><option value="80" ${c.paper==="80"?"selected":""}>80 mm (estándar)</option><option value="58" ${c.paper==="58"?"selected":""}>58 mm (pequeña)</option></select></div></div>
  <div class="f"><div><label for="at">IVA (%). Pon 0 si no lo cobras</label><input id="at" type="number" min="0" step="0.01" value="${c.tax}"></div><div><label for="al">Aviso de stock bajo por defecto</label><input id="al" type="number" min="0" value="${c.lowDefault}"></div><div><label for="anx">Próxima factura número</label><input id="anx" type="number" min="1" value="${c.next}"></div></div>
  <div><label for="af2">Mensaje al pie de la factura</label><textarea id="af2" rows="2">${esc(c.footer)}</textarea></div>
  <div class="row" style="justify-content:space-between"><button type="button" class="btn" data-act="backup">Descargar respaldo (JSON)</button><button class="btn p">Guardar ajustes</button></div></form></div>${mode!=="db"?`<div class="card" style="margin-top:14px"><h2>Respaldo y otro dispositivo</h2><p class="note" style="margin:0 0 10px">Tus datos viven en este dispositivo y funcionan sin internet. Descarga un respaldo seguido, y restáuralo aquí si cambias de teléfono o computadora.</p><label for="rst">Restaurar desde un respaldo (.json)</label><input id="rst" type="file" accept=".json,application/json">${CAN_PRINT?`<div class="row" style="margin-top:14px;justify-content:space-between"><span class="note">Versión ${typeof APP_VERSION!=="undefined"?APP_VERSION:""}. Se actualiza sola al abrir con internet.</span><button type="button" class="btn s" data-act="upd">Buscar actualización</button></div>`:""}</div>`:""}${CAN_PRINT&&!matchMedia("(display-mode: standalone)").matches?`<div class="card" style="margin-top:14px"><h2>Instalar la app</h2><div class="f"><div><b>Android</b><div class="note">Chrome → menú ⋮ → Instalar app.</div></div><div><b>iPhone</b><div class="note">Abre en Safari → Compartir → Añadir a pantalla de inicio.</div></div><div><b>PC</b><div class="note">Chrome o Edge → icono de instalar en la barra de direcciones.</div></div></div><div class="row" style="margin-top:12px"><button class="btn p" data-act="install">Instalar ahora</button></div></div>`:""}`;
}
function dismissed(){try{return new Set(JSON.parse(localStorage.getItem("tp_dis")||"[]"))}catch(e){return new Set()}}
function saveDis(s){try{localStorage.setItem("tp_dis",JSON.stringify([...s].slice(-300)))}catch(e){}}
function alerts(){
  const out=[],dis=dismissed(),now=Date.now();
  list("products").forEach(p=>{if(p.stock<=(Number(p.min)||0))out.push({key:"s:"+p.id+":"+p.stock,lvl:p.stock<=0?"bad":"warn",title:p.stock<=0?"Agotado: "+p.name:"Stock bajo: "+p.name,text:p.stock<=0?"No queda existencia. Registra una entrada cuando llegue mercadería.":"Quedan "+p.stock+" unidades.",go:"inv"})});
  list("repairs").forEach(r=>{
    if(r.status==="Listo")out.push({key:"r:"+r.id+":listo",lvl:"good",title:"Listo para entregar: "+r.device,text:r.customer.name+(r.customer.phone?" · "+r.customer.phone:"")+" · saldo "+money(Math.max(0,repTotal(r)-(+r.deposit||0))),rep:r.id});
    else if(r.status!=="Entregado"&&now-new Date(r.ts)>5*864e5)out.push({key:"a:"+r.id,lvl:"warn",title:"Más de 5 días en taller: "+r.device,text:r.customer.name+" · orden "+r.num+" · "+r.status,rep:r.id});
    if(r.status==="Entregado"&&!r.saleId)out.push({key:"f:"+r.id,lvl:"warn",title:"Entregado sin facturar: "+r.device,text:"Orden "+r.num+" de "+r.customer.name,rep:r.id});
  });
  try{if(mode!=="db"&&(list("sales").length||list("products").length)){const lb=+(localStorage.getItem("tp_backup")||0);if(now-lb>7*864e5)out.push({key:"b:"+Math.floor(now/(7*864e5)),lvl:"warn",title:"Haz un respaldo de tus datos",text:lb?"El último respaldo tiene más de 7 días.":"Aún no has descargado ningún respaldo.",go:"aj"})}}catch(e){}
  return out.filter(a=>!dis.has(a.key));
}
function updateBell(){
  const al=alerts(),n=$("#bellN");n.textContent=al.length>99?"99+":al.length;n.hidden=!al.length;
  if(!ui.armed)return;
  const fresh=al.filter(a=>!ui.seen.has(a.key));
  fresh.forEach(a=>ui.seen.add(a.key));
  if(fresh.length)toast("Alerta: "+fresh[0].title+(fresh.length>1?" (+"+(fresh.length-1)+" más)":""));
}
function alertsModal(){
  const al=alerts();
  openModal(`<h2>Notificaciones</h2><p class="note">Avisos de tu taller: inventario, equipos listos y pendientes.</p><div style="margin-top:10px">${al.map(a=>`<div class="al"><span class="dot ${a.lvl==="warn"?"":a.lvl}"></span><div><b>${esc(a.title)}</b><div class="note">${esc(a.text)}</div></div><div class="row" style="flex-wrap:nowrap"><button class="btn s" data-act="algo" data-id="${esc(a.key)}">Ver</button><button class="btn s" data-act="aldis" data-id="${esc(a.key)}" aria-label="Descartar">✕</button></div></div>`).join("")||`<div class="empty">No hay avisos pendientes.</div>`}</div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-act="alall" ${al.length?"":"disabled"}>Descartar todas</button><button class="btn p" data-act="close">Cerrar</button></div>`);
}
const VIEWS={panel:vPanel,venta:vVenta,rep:vRep,inv:vInv,fac:vFac,aj:vAj};
function render(force){
  const a=document.activeElement;
  if(!force&&a&&$("#main").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&view==="aj")return;
  $("#main").innerHTML=VIEWS[view]();
  $("#brandName").textContent=cfg().name;updateBell();
  document.querySelectorAll(".nav").forEach(b=>b.dataset.v===view?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  const f=$("#af");if(f)f.onsubmit=async e=>{e.preventDefault();await putSettings({name:$("#an").value.trim()||"Mi Taller",phone:$("#aph").value.trim(),ruc:$("#ar").value.trim(),address:$("#aa").value.trim(),tax:+$("#at").value||0,lowDefault:parseInt($("#al").value)||0,next:parseInt($("#anx").value)||1,footer:$("#af2").value,paper:$("#apw").value});toast("Ajustes guardados");render(true)};
}
function go(v){view=v;render(true);window.scrollTo(0,0)}
</script>
<script>
document.addEventListener("click",async e=>{
  const n=e.target.closest(".nav");if(n){go(n.dataset.v);return}
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case"close":closeModal();break;
    case"newp":prodForm();break;
    case"editp":prodForm({...S.products[id],id});break;
    case"delp":if(b.dataset.sure){await del("products",id);closeModal();toast("Producto eliminado")}else{b.dataset.sure=1;b.textContent="Confirmar eliminación"}break;
    case"stock":stockForm(id);break;
    case"hist":histModal(id);break;
    case"ifilter":ui.ifilter=id;render(true);break;
    case"rf":ui.rf=id;render(true);break;
    case"add":{const p=S.products[id],l=ui.cart.find(x=>x.pid===id);syncCust();if(l){if(l.qty<p.stock)l.qty++}else ui.cart.push({pid:id,name:p.name,qty:1,price:p.price,cost:p.cost});render(true);break}
    case"inc":{const l=ui.cart[id];syncCust();if(!l.pid||l.qty<(S.products[l.pid]?.stock||0))l.qty++;else toast("No hay más existencia");render(true);break}
    case"dec":{const l=ui.cart[id];syncCust();l.qty--;if(l.qty<=0)ui.cart.splice(id,1);render(true);break}
    case"rml":syncCust();ui.cart.splice(id,1);render(true);break;
    case"addsv":{const n=$("#svn").value.trim(),p=+$("#svp").value;if(!n||!(p>=0)||$("#svp").value===""){toast("Escribe el servicio y su precio");break}syncCust();ui.cart.push({name:n,qty:1,price:p,cost:0});render(true);break}
    case"clear":ui.cart=[];render(true);break;
    case"checkout":checkout();break;
    case"seeinv":showInvoice(id);break;
    case"copyinv":try{await navigator.clipboard.writeText(invText(S.sales[id]));toast("Factura copiada")}catch(x){toast("No se pudo copiar")}break;
    case"dorestore":if(ui.pending&&mode!=="db"){COLS.forEach(c=>S[c]=ui.pending[c]||{});S.settings=ui.pending.settings||{};saveLocal();ui.pending=null;closeModal();render(true);toast("Respaldo restaurado")}break;
    case"upd":{const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(!r){toast("Las actualizaciones solo funcionan en la app instalada");break}toast("Buscando actualización…");try{await r.update()}catch(x){toast("Sin conexión para actualizar");break}setTimeout(()=>{if(!r.installing&&!r.waiting)toast("Ya tienes la última versión")},2500);break}
    case"fmt":showInvoice(id,b.dataset.f);break;
    case"prt":printDoc(ui.fmt,id);break;
    case"dlk":dlDoc(ui.fmt,id);break;
    case"install":if(window.deferredInstall){window.deferredInstall.prompt();await window.deferredInstall.userChoice;window.deferredInstall=null;$("#installBtn").hidden=true}else toast("Usa el menú del navegador: Instalar app o Añadir a pantalla de inicio");break;
    case"void":if(b.dataset.sure)voidSale(id);else{b.dataset.sure=1;b.textContent="Confirmar anulación"}break;
    case"newr":repForm();break;
    case"editr":repForm(id);break;
    case"addpart":addPart(id);break;
    case"rmpart":rmPart(id,+b.dataset.i);break;
    case"billr":billRepair(id);break;
    case"csvinv":download("inventario-"+today()+".csv",csv([["Código","Producto","Categoría","Costo","Precio","Existencia","Mínimo"],...list("products").map(p=>[p.sku,p.name,p.category,p.cost,p.price,p.stock,p.min])]));break;
    case"csvsales":download("ventas-"+today()+".csv",csv([["Factura","Fecha","Cliente","Pago","Estado","Producto","Cantidad","Precio","Importe"],...list("sales").flatMap(s=>s.items.map(l=>[s.num,s.ts.slice(0,10),s.customer.name,s.method,s.status,l.name,l.qty,l.price,l.qty*l.price]))]));break;
    case"bell":alertsModal();break;
    case"aldis":{const d=dismissed();d.add(id);saveDis(d);alertsModal();updateBell();break}
    case"alall":{const d=dismissed();alerts().forEach(a=>d.add(a.key));saveDis(d);alertsModal();updateBell();break}
    case"algo":{const a=alerts().find(x=>x.key===id);closeModal();if(a&&a.rep){go("rep");repForm(a.rep)}else go(a&&a.go||"inv");break}
        case"rmlogo":await putSettings({logo:""});render(true);toast("Logo quitado");break;
    case"backup":try{localStorage.setItem("tp_backup",Date.now())}catch(x){}download("respaldo-taller-"+today()+".json",JSON.stringify(S,null,1));break;
  }
});
document.addEventListener("input",e=>{
  const id=e.target.id,m={iq:"iq",pq:"pq",fq:"fq",rq:"rq"};
  if(m[id]){ui[m[id]]=e.target.value;const pos=e.target.selectionStart;render(true);const el=$("#"+id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(x){}}}
  else if(id==="cd"){syncCust();$("#totbox").innerHTML=totBox()}
  else if(["cn","cp","cm"].includes(id))syncCust();
});
document.addEventListener("change",async e=>{
  if(e.target.id==="rst"&&e.target.files[0]){
    try{const d=JSON.parse(await e.target.files[0].text());if(!d||typeof d.products!=="object"||typeof d.sales!=="object")throw 0;ui.pending=d;
      openModal(`<h2>Restaurar respaldo</h2><p>Se reemplazarán los datos de este dispositivo por el respaldo: <b>${Object.keys(d.products).length}</b> productos, <b>${Object.keys(d.sales).length}</b> facturas y <b>${Object.keys(d.repairs||{}).length}</b> reparaciones.</p><p class="note">Los datos actuales se perderán. Descarga un respaldo antes si no estás seguro.</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-act="close">Cancelar</button><button class="btn p" data-act="dorestore">Restaurar</button></div>`)}
    catch(x){toast("Ese archivo no es un respaldo válido")}
    e.target.value="";return}
  if(e.target.id!=="alg"||!e.target.files[0])return;
  try{const logo=await readLogo(e.target.files[0]);await putSettings({logo});const p=$("#logoPrev");if(p){p.src=logo;p.style.display=""}toast("Logo guardado")}catch(x){toast("No se pudo leer la imagen")}
});
addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.deferredInstall=e;$("#installBtn").hidden=false});
addEventListener("appinstalled",()=>{window.deferredInstall=null;$("#installBtn").hidden=true;toast("App instalada")});
(async()=>{render(true);await initStore();render(true);setTimeout(()=>{ui.seen=new Set(alerts().map(a=>a.key));ui.armed=true},1800)})();
</script>

<script>
const APP_VERSION="2.1 · 18 nov 2026";
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){
  let had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!had){had=true;return}
    if(window.__rl)return;
    if(!ui.cart.length&&$("#modal").hidden){window.__rl=1;location.reload()}
    else toast("Nueva versión lista. Se aplicará al reabrir la app.");
  });
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update();setInterval(()=>r.update(),1800000)}).catch(()=>{}));
}
</script>
