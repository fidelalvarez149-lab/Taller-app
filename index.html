<style>
/* Layout: sidebar nav on desktop, bottom tab bar on phone; one workspace per view */
:root{--bg:#f3f4f6;--surface:#fff;--surface2:#eceef2;--fg:#14171f;--muted:#69707f;--line:#dde0e6;--accent:#e4580f;--accent-fg:#fff;--good:#157f4b;--warn:#a96a00;--bad:#c4281c;--goodbg:#dcf3e6;--warnbg:#fbeccb;--badbg:#fbdcd8;--side:#14171f;--sidefg:#c9ced9;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1015;--surface:#171a22;--surface2:#212531;--fg:#eef0f5;--muted:#9097a8;--line:#2a2f3c;--accent:#ff7a33;--accent-fg:#1a0d04;--good:#4cd08a;--warn:#f0b445;--bad:#ff7b6e;--goodbg:#12301f;--warnbg:#3a2c0d;--badbg:#401a16;--side:#0a0c10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1015;--surface:#171a22;--surface2:#212531;--fg:#eef0f5;--muted:#9097a8;--line:#2a2f3c;--accent:#ff7a33;--accent-fg:#1a0d04;--good:#4cd08a;--warn:#f0b445;--bad:#ff7b6e;--goodbg:#12301f;--warnbg:#3a2c0d;--badbg:#401a16;--side:#0a0c10;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:14px;line-height:1.45;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--sidefg);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}

.pick b{display:block;font-weight:600}.pick span{font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(8,10,14,.6);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;z-index:50}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:14px;max-width:720px;width:100%;padding:22px;margin:auto 0}
.inv{background:#fff;color:#14171f;border-radius:8px;padding:26px;border:1px solid #ddd;font-size:13px}
.inv h2{font-size:22px}.inv table th{color:#666;border-color:#ddd}.inv td{border-color:#eee}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:60;font-weight:600}
.toast[hidden]{display:none}
.note{font-size:12px;color:var(--muted)}
.bell{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));z-index:45;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--fg)}
.bell:hover{border-color:var(--muted)}.bell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bell b{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px var(--f-b);display:grid;place-items:center;padding:0 4px}
.bell b[hidden]{display:none}.top{padding-right:52px}
.al{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--warn)}.dot.bad{background:var(--bad)}.dot.good{background:var(--good)}
/* Acabado premium: botones con relieve, profundidad suave y foco visible */
.btn{border-radius:10px;padding:10px 17px;letter-spacing:.005em;box-shadow:0 1px 2px rgba(16,20,30,.07),inset 0 1px 0 color-mix(in srgb,#fff 18%,transparent);transition:transform .12s,box-shadow .18s,border-color .18s,background .18s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 16px -10px rgba(16,20,30,.35),inset 0 1px 0 color-mix(in srgb,#fff 18%,transparent)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.p{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 84%,#fff),var(--accent));border-color:color-mix(in srgb,var(--accent) 78%,#000);box-shadow:0 10px 20px -10px color-mix(in srgb,var(--accent) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.p:hover{filter:none;box-shadow:0 14px 26px -10px color-mix(in srgb,var(--accent) 90%,transparent),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.d{background:color-mix(in srgb,var(--bad) 8%,var(--surface));border-color:color-mix(in srgb,var(--bad) 32%,var(--line))}
.btn.s{border-radius:8px;padding:6px 11px}
.btn:disabled{transform:none;box-shadow:none}
.side{background:linear-gradient(180deg,var(--side),color-mix(in srgb,var(--side) 88%,#fff));border-right:1px solid rgba(255,255,255,.06)}
.nav{border-radius:10px;transition:background .15s,transform .12s}
.nav:active{transform:scale(.97)}
.nav[aria-current="page"]{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 68%,#8a1c00));box-shadow:0 10px 20px -10px var(--accent)}
.card,.kpi{border-radius:16px;box-shadow:0 1px 2px rgba(16,20,30,.04),0 14px 28px -20px rgba(16,20,30,.28)}
.kpi{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 93%,var(--accent)))}
.kpi b{font-size:28px}.top h1{font-size:30px}
th{background:color-mix(in srgb,var(--surface2) 55%,transparent)}
tbody tr{transition:background .12s}tbody tr:hover{background:color-mix(in srgb,var(--surface2) 55%,transparent)}
input,select,textarea{border-radius:10px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);outline:none}
.tab{padding:7px 15px;transition:border-color .15s,background .15s}.tab:hover{border-color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px}.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pick button{border-radius:12px;background:var(--surface);border:1px solid var(--line);transition:transform .12s,box-shadow .18s,border-color .18s}
.pick button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent);box-shadow:0 12px 20px -14px rgba(16,20,30,.4)}
.qty button{transition:border-color .15s}.qty button:hover{border-color:var(--accent)}
.modal{backdrop-filter:blur(6px)}
.sheet{border-radius:18px;border:1px solid var(--line);box-shadow:0 34px 70px -24px rgba(0,0,0,.55)}
.bell{box-shadow:0 8px 18px -10px rgba(16,20,30,.45);transition:transform .12s}.bell:hover{transform:translateY(-1px)}
.toast{border-radius:12px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tkp{background:#fff;color:#000;font:12px/1.35 "Courier New",monospace;margin:0 auto;box-shadow:0 12px 28px -14px rgba(0,0,0,.45);max-width:100%}
.tkp .t{padding:3mm}.tkp .c{text-align:center}.tkp .b{font-weight:700}.tkp .big{font-size:14px}.tkp .r{display:flex;justify-content:space-between;gap:6px}.tkp hr{border:0;border-top:1px dashed #000;margin:6px 0}
.gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.gate .sheet{box-shadow:0 30px 70px -30px rgba(0,0,0,.45)}
@media (max-width:900px){
.app{grid-template-columns:1fr}
.side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px max(6px,env(safe-area-inset-left,0px)) max(6px,env(safe-area-inset-bottom,0px));z-index:40;justify-content:space-around;gap:2px}
.brand,.sp,.side .hide-m{display:none}
.nav{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;text-align:center;justify-content:center}
.main{padding-bottom:96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.two,.pos{grid-template-columns:minmax(0,1fr)}
.top h1{font-size:23px}
}
@media (max-width:900px){.side{justify-content:flex-start;overflow-x:auto}.nav{flex:0 0 auto;min-width:74px;width:auto}}
td.n,th.n{white-space:nowrap}
</style>

<script>
"use strict";
const COLS=["products","sales","repairs","moves","clientes"];
const S={products:{},sales:{},repairs:{},moves:{},clientes:{},usuarios:{},settings:{}};
const DEF={name:"Mi Taller",phone:"",address:"",ruc:"",tax:0,next:1,nextRep:1,footer:"Gracias por su preferencia. Garantía de reparación: 30 días.",lowDefault:3,paper:"80",logo:"",enc:"cp858",prLogo:true,autoprint:false,baud:9600,prmethod:"direct"};
let DB=null,FS=false,mode="local",view="panel",ui={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cfg=()=>({...DEF,...S.settings});
const money=n=>"C$ "+(Number(n)||0).toLocaleString("es-NI",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toLocaleDateString("sv-SE");
const fdate=iso=>new Date(iso).toLocaleString("es-NI",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const list=c=>Object.entries(S[c]).map(([id,v])=>({...v,id}));
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function updNet(){const n=$("#syncNote");if(!n)return;const on=navigator.onLine;n.textContent=mode==="db"?(on?"Datos guardados en la nube.":"Sin conexión con la nube."):mode==="cloud"?(on?"Sincronizado con la nube en tiempo real.":"Sin internet · se sincronizará al volver."):CS&&CS.state==="login"?"Nube: falta iniciar sesión.":CS&&CS.state==="error"?"Nube: sin conexión. Usando datos de este dispositivo.":(on?"Funciona sin internet. Datos en este dispositivo.":"Sin internet · todo se guarda en este dispositivo.")}
let _sv;function saveLocalSoon(){clearTimeout(_sv);_sv=setTimeout(saveLocal,400)}
const lsKey=()=>cloudCfg()?"tallerpro_cloud":"tallerpro";
function saveLocal(){try{localStorage.setItem(lsKey(),JSON.stringify(S))}catch(e){toast("No hay espacio para guardar. Descarga un respaldo en Ajustes.")}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(lsKey())||"null");if(d)COLS.concat("settings").forEach(c=>{if(d[c])S[c]=d[c]})}catch(e){}}
async function put(col,id,data){
  S[col][id]=data;
  if(FS){DB.collection(col).doc(id).set(clean(data)).catch(e=>toast("No se pudo sincronizar: "+(e.code||"error")));saveLocalSoon();return}
  if(DB){try{await DB.collection(col).doc(id).set(data)}catch(e){toast("No se pudo guardar: "+(e.code||"error"))}}else saveLocal();
}
async function del(col,id){
  delete S[col][id];
  if(FS){DB.collection(col).doc(id).delete().catch(()=>{});saveLocalSoon();return}
  if(DB){try{await DB.collection(col).doc(id).delete()}catch(e){toast("No se pudo borrar")}}else saveLocal();
}
async function putSettings(patch){
  S.settings={...S.settings,...patch};
  if(FS){DB.doc("config/main").set(clean(S.settings)).catch(()=>{});saveLocalSoon();return}
  if(DB){try{await DB.doc("config/main").set(S.settings)}catch(e){toast("No se pudo guardar ajustes")}}else saveLocal();
}
async function initStore(){
  loadLocal();
  try{DB=window.claude?await window.claude.use("db"):null}catch(e){DB=null}

<script>
/* Roles: administrador y empleado. Sin nube, el dispositivo es administrador. Con nube, el rol viene de la cuenta. */
let ME={uid:"",nombre:"Administrador",rol:"admin",activo:true},ROLE="admin",_started=false;

const authMsg=e=>({"auth/invalid-credential":"Correo o contraseña incorrectos.","auth/wrong-password":"Correo o contraseña incorrectos.","auth/user-not-found":"Ese correo no existe en Firebase.","auth/network-request-failed":"Sin internet para iniciar sesión.","auth/invalid-api-key":"La configuración de Firebase no es válida.","auth/too-many-requests":"Demasiados intentos. Espera unos minutos."}[e.code]||e.message||"No se pudo conectar");

    offline:`<p class="note">No se pudo conectar y este dispositivo aún no tiene datos de acceso guardados. Conéctate a internet una vez para entrar.</p><div class="grid" style="margin-top:14px"><button class="btn p" data-act="goretry">Reintentar</button></div>`
  };

function useCachedRole(uid){
  try{const r=JSON.parse(localStorage.getItem("tp_role")||"null");if(r&&r.activo&&(!uid||r.uid===uid)){applyRole(r,{uid:r.uid});return true}}catch(e){}
  return false;
}
function applyRole(u,user){
  const r={uid:user.uid,nombre:u.nombre||"",email:u.email||"",rol:u.rol==="admin"?"admin":"empleado",activo:true};
  if(_started&&r.rol!==ROLE){location.reload();return}
  ME=r;ROLE=r.rol;try{localStorage.setItem("tp_role",JSON.stringify(r))}catch(e){}
  if(!_started){_started=true;startSync()}

}
function startSync(){
  const first=col=>{if(ui.seen)alerts().forEach(a=>ui.seen.add(a.key));ui["fs_"+col]=1};
  COLS.forEach(col=>DB.collection(col).onSnapshot(sn=>{
    if(sn.metadata.fromCache&&sn.empty&&Object.keys(S[col]).length)return;
    S[col]={};sn.docs.forEach(d=>S[col][d.id]=d.data());
    if(!sn.metadata.fromCache&&!ui["fs_"+col])first(col);

  },e=>toast("Error de sincronización: "+(e.code||e.message))));
  DB.doc("config/main").onSnapshot(d=>{S.settings=d.exists?d.data():{};saveLocalSoon();render()},()=>{});
  if(isAdmin())DB.collection("usuarios").onSnapshot(sn=>{S.usuarios={};sn.docs.forEach(d=>S.usuarios[d.id]=d.data());render()},()=>{});

}
async function goLogin(){

/* Clientes */

async function ensureClient(name,phone){

function repRange(){
  const p=ui.rp||"mes",now=new Date(),d=n=>new Date(now.getFullYear(),now.getMonth(),now.getDate()-n),ymd=x=>x.toLocaleDateString("sv-SE");
  if(p==="hoy")return[ymd(now),ymd(now)];if(p==="7d")return[ymd(d(6)),ymd(now)];
  if(p==="mes")return[ymd(new Date(now.getFullYear(),now.getMonth(),1)),ymd(now)];
  if(p==="ant")return[ymd(new Date(now.getFullYear(),now.getMonth()-1,1)),ymd(new Date(now.getFullYear(),now.getMonth(),0))];
  if(p==="todo")return["0000-01-01","9999-12-31"];
  return[ui.rfrom||ymd(d(29)),ui.rto||ymd(now)];
}
const saleProfit=s=>s.items.reduce((b,l)=>b+(l.price-(l.cost||0))*l.qty,0)-(s.discount||0);
function repoData(){
  const[a,b]=repRange(),all=list("sales").filter(s=>{const x=localDay(s.ts);return x>=a&&x<=b}),ok=all.filter(s=>s.status!=="anulada");
  const tot=ok.reduce((s,x)=>s+x.total,0),gan=ok.reduce((s,x)=>s+saleProfit(x),0);
  const grp=(keyf)=>{const m={};ok.forEach(s=>{const k=keyf(s)||"—";(m[k]=m[k]||{n:0,t:0,g:0});m[k].n++;m[k].t+=s.total;m[k].g+=saleProfit(s)});return Object.entries(m).sort((x,y)=>y[1].t-x[1].t)};
  const prod={};ok.forEach(s=>s.items.forEach(l=>{const k=l.name;(prod[k]=prod[k]||{q:0,t:0,g:0});prod[k].q+=l.qty;prod[k].t+=l.qty*l.price;prod[k].g+=(l.price-(l.cost||0))*l.qty}));
  return{a,b,all,ok,tot,gan,days:grp(s=>localDay(s.ts)).sort((x,y)=>x[0].localeCompare(y[0])),emp:grp(s=>(s.by&&s.by.name)||s.device),pay:grp(s=>s.method),prod:Object.entries(prod).sort((x,y)=>y[1].g-x[1].g)};
}

  <div class="kpi"><span>Ganancia</span><b>${money(r.gan)}</b><em>Margen ${r.tot?Math.round(r.gan/r.tot*100):0}% sobre ventas</em></div>

  <div class="grid"><div class="card"><h2>Por empleado</h2><div class="tw"><table><thead><tr><th>Quién</th><th class="n">Ventas</th><th class="n">Total</th><th class="n">Ganancia</th></tr></thead><tbody>${r.emp.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.n}</td><td class="n">${money(v.t)}</td><td class="n">${money(v.g)}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">—</td></tr>`}</tbody></table></div></div>
  <div class="card"><h2>Por forma de pago</h2>${r.pay.map(([k,v])=>`<div class="tot"><span>${esc(k)} <span class="note">(${v.n})</span></span><b>${money(v.t)}</b></div>`).join("")||`<div class="note">—</div>`}</div></div></div>
  <div class="card" style="margin-top:14px"><h2>Productos y servicios: lo que más ganancia dejó</h2><div class="tw"><table><thead><tr><th>Producto</th><th class="n">Unidades</th><th class="n">Vendido</th><th class="n">Ganancia</th></tr></thead><tbody>${r.prod.slice(0,15).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.q}</td><td class="n">${money(v.t)}</td><td class="n"><b>${money(v.g)}</b></td></tr>`).join("")||`<tr><td colspan="4" class="empty">Sin ventas en este período.</td></tr>`}</tbody></table></div></div>
  <div class="card" style="margin-top:14px"><h2>Inventario hoy</h2><div class="row" style="gap:28px"><div><span class="note">Invertido (a costo)</span><div><b>${money(ps.reduce((s,p)=>s+p.stock*p.cost,0))}</b></div></div><div><span class="note">Valor a la venta</span><div><b>${money(ps.reduce((s,p)=>s+p.stock*p.price,0))}</b></div></div><div><span class="note">Por reponer</span><div><b>${ps.filter(p=>p.stock<=(Number(p.min)||0)).length}</b></div></div></div></div>`;
}

async function empNew(){
  const g=id=>$("#"+id).value.trim(),nm=g("te_name"),mail=g("te_mail"),pass=$("#te_pass").value,rol=$("#te_rol").value;
  if(!nm||!mail||pass.length<6){toast("Escribe nombre, correo y una contraseña de al menos 6 caracteres");return}
  if(!FS||!navigator.onLine){toast("Necesitas internet para crear empleados");return}
  let sec;
  try{
    sec=firebase.initializeApp(cloudCfg().config,"sec"+Date.now());
    const cr=await sec.auth().createUserWithEmailAndPassword(mail,pass);
    await DB.doc("usuarios/"+cr.user.uid).set({nombre:nm,email:mail,rol,activo:true,ts:new Date().toISOString(),creadoPor:ME.uid});

  finally{try{if(sec)await sec.delete()}catch(e){}}
}
async function empAct(kind,id){
  const u=S.usuarios[id];if(!u||id===ME.uid)return;
  try{
    if(kind==="toggle"){await DB.doc("usuarios/"+id).update({activo:!u.activo});toast(u.activo?"Empleado desactivado":"Empleado activado")}
    else if(kind==="role"){await DB.doc("usuarios/"+id).update({rol:u.rol==="admin"?"empleado":"admin"});toast("Rol actualizado")}
    else if(kind==="pw"){await firebase.auth().sendPasswordResetEmail(u.email);toast("Enlace enviado a "+u.email)}
  }catch(e){toast("No se pudo: "+(e.code||e.message))}
}

<script>
/* Edición de facturas (solo administrador): al guardar se recalcula inventario, ventas de hoy, ventas del mes y ganancia */
const r2=n=>Math.round((+n||0)*100)/100;
const cmpTxt=(a,b,t)=>b>0?` · ${a>=b?"▲":"▼"} ${Math.abs(Math.round((a-b)/b*100))}%${t}`:"";
function salesNow(){
  const ok=list("sales").filter(s=>s.status!=="anulada"),d0=today(),m0=d0.slice(0,7);
  const mon=ok.filter(s=>localDay(s.ts).slice(0,7)===m0);
  return{day:r2(ok.filter(s=>localDay(s.ts)===d0).reduce((t,s)=>t+s.total,0)),mon:r2(mon.reduce((t,s)=>t+s.total,0)),gan:r2(mon.reduce((t,s)=>t+saleProfit(s),0))};
}
function einvOpen(id){
  const s=S.sales[id];if(!s||s.status==="anulada")return;
  ui.edit={id,items:s.items.map(l=>({...l})),name:s.customer.name,phone:s.customer.phone||"",method:s.method,disc:s.discount||0};einvDraw();
}
function einvTot(){
  const E=ui.edit,s=S.sales[E.id],sub=r2(E.items.reduce((t,l)=>t+l.qty*l.price,0)),disc=r2(Math.min(sub,Math.max(0,+E.disc||0))),tax=r2((sub-disc)*(s.taxRate||0)/100);
  return{sub,disc,tax,total:r2(sub-disc+tax)};
}
function einvTotHTML(){
  const E=ui.edit,s=S.sales[E.id],t=einvTot(),d=r2(t.total-s.total);
  return `<div class="tot"><span>Subtotal</span><span>${money(t.sub)}</span></div>${t.disc?`<div class="tot"><span>Descuento</span><span>− ${money(t.disc)}</span></div>`:""}${t.tax?`<div class="tot"><span>IVA ${s.taxRate}%</span><span>${money(t.tax)}</span></div>`:""}<div class="tot big"><span>Total</span><span>${money(t.total)}</span></div><div class="note" style="text-align:right">${d===0?"Sin cambios en el total":"Antes "+money(s.total)+" · "+(d>0?"sube ":"baja ")+money(Math.abs(d))}</div>`;
}
function einvDraw(){
  const E=ui.edit,s=S.sales[E.id],ps=list("products").sort((a,b)=>a.name.localeCompare(b.name));
  openModal(`<h2>Editar factura ${esc(s.num)}</h2><p class="note">Al guardar se actualizan el inventario, las ventas de hoy y del mes, y la ganancia.</p>
  <div class="f" style="margin-top:12px"><div><label for="ei_cn">Cliente</label><input id="ei_cn" list="clist" autocomplete="off" data-ei="name" value="${esc(E.name)}">${clientList()}</div><div><label for="ei_cp">Teléfono</label><input id="ei_cp" data-ei="phone" inputmode="tel" value="${esc(E.phone)}"></div>

  <div class="tw" style="margin-top:12px"><table><thead><tr><th>Descripción</th><th class="n">Cant.</th><th class="n">Precio</th><th class="n">Importe</th><th></th></tr></thead><tbody>
  ${E.items.map((l,i)=>`<tr><td>${esc(l.name)}${l.pid?"":` <span class="note">servicio</span>`}</td><td class="n"><input type="number" min="0" step="1" value="${l.qty}" data-ei="qty" data-i="${i}" aria-label="Cantidad" style="width:76px"></td><td class="n"><input type="number" min="0" step="0.01" value="${l.price}" data-ei="price" data-i="${i}" aria-label="Precio" style="width:104px"></td><td class="n" id="eil_${i}">${money(l.qty*l.price)}</td><td class="n"><button type="button" class="btn s d" data-act="eirm" data-id="${i}">Quitar</button></td></tr>`).join("")}</tbody></table></div>
  <div class="row" style="margin-top:10px"><select id="ei_add" style="flex:2;min-width:180px"><option value="">Agregar producto del inventario…</option>${ps.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.stock}) · ${money(p.price)}</option>`).join("")}</select><button type="button" class="btn" data-act="eiadd">Agregar</button></div>
  <div class="row" style="margin-top:8px"><input id="ei_svn" placeholder="Servicio o mano de obra" style="flex:2;min-width:160px"><input id="ei_svp" type="number" min="0" step="0.01" placeholder="Precio C$" style="flex:1;min-width:90px"><button type="button" class="btn" data-act="eisv">Agregar</button></div>
  <div id="eitot" style="margin-top:14px">${einvTotHTML()}</div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn" data-act="seeinv" data-id="${E.id}">Cancelar</button><button type="button" class="btn p" data-act="einvsave">Guardar cambios</button></div>`);
}
async function einvSave(){
  const E=ui.edit,s=E&&S.sales[E.id];if(!s||s.status==="anulada")return;
  const items=E.items.filter(l=>l.qty>0).map(l=>({...l,qty:Math.round(l.qty)}));
  if(!items.length){toast("La factura necesita al menos una línea");return}
  const oldQ={},newQ={};s.items.forEach(l=>{if(l.pid)oldQ[l.pid]=(oldQ[l.pid]||0)+l.qty});items.forEach(l=>{if(l.pid)newQ[l.pid]=(newQ[l.pid]||0)+l.qty});
  for(const pid in newQ){const p=S.products[pid];if(p&&newQ[pid]-(oldQ[pid]||0)>p.stock){toast("No hay suficiente existencia de "+p.name+" (quedan "+p.stock+")");return}}
  const t=einvTot(),name=E.name.trim()||"Consumidor final",cid=await ensureClient(name,E.phone),before=salesNow();
  const edit={ts:new Date().toISOString(),by:myName(),prev:s.total,now:t.total};
  await put("sales",E.id,{...s,customer:{name,phone:E.phone.trim()},method:E.method,items,subtotal:t.sub,discount:t.disc,tax:t.tax,total:t.total,cid,edits:[...(s.edits||[]),edit].slice(-20)});
  for(const pid of new Set([...Object.keys(oldQ),...Object.keys(newQ)])){const d=(oldQ[pid]||0)-(newQ[pid]||0);if(d!==0&&S.products[pid])await adjustStock(pid,d,"ajuste","Edición de factura "+s.num)}
  ui.edit=null;closeModal();render(true);showInvoice(E.id);
  const now=salesNow();toast("Factura "+s.num+" actualizada · Ventas de hoy "+money(now.day)+(now.mon!==before.mon?" · Mes "+money(now.mon):""));
}

<script>
/* Impresión directa: ESC/POS por Bluetooth BLE, USB/serie (PC) o RawBT (Android) */
const MAP={"á":0xA0,"é":0x82,"í":0xA1,"ó":0xA2,"ú":0xA3,"ñ":0xA4,"Ñ":0xA5,"¿":0xA8,"¡":0xAD,"Á":0xB5,"É":0x90,"Í":0xD6,"Ó":0xE0,"Ú":0xE9,"ü":0x81,"Ü":0x9A,"·":0xFA,"—":0x2D,"–":0x2D,"“":0x22,"”":0x22,"’":0x27};
const strip=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"");
function encText(str){
  const ascii=cfg().enc==="ascii",t=ascii?strip(str):String(str),out=[];
  for(const ch of t){const c=ch.charCodeAt(0);if(c>=32&&c<127||c===10)out.push(c);else if(!ascii&&MAP[ch]!==undefined)out.push(MAP[ch]);else out.push(63)}
  return out;
}
function wrapTxt(s,n){const w=[];let l="";String(s).split(/\s+/).forEach(x=>{while(x.length>n){if(l){w.push(l);l=""}w.push(x.slice(0,n));x=x.slice(n)}if((l+" "+x).trim().length>n){w.push(l);l=x}else l=(l+" "+x).trim()});if(l)w.push(l);return w.length?w:[""]}
const padLR=(a,b,n)=>{a=String(a);b=String(b);const sp=n-a.length-b.length;return sp>0?a+" ".repeat(sp)+b:a.slice(0,Math.max(0,n-b.length-1))+" "+b};
const mny=n=>money(n).replace("C$ ","C$");
function rasterLogo(dataUrl,maxW){
  return new Promise(res=>{
    const img=new Image();img.onerror=()=>res(null);
    img.onload=()=>{
      const w=Math.max(8,Math.floor(Math.min(maxW,img.width)/8)*8),h=Math.min(200,Math.max(1,Math.round(img.height*w/img.width)));
      const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      const d=x.getImageData(0,0,w,h).data,bpr=w/8,out=[0x1D,0x76,0x30,0,bpr&255,bpr>>8,h&255,h>>8];
      for(let y=0;y<h;y++)for(let b=0;b<bpr;b++){let v=0;for(let k=0;k<8;k++){const i=((y*w)+b*8+k)*4,lum=.3*d[i]+.59*d[i+1]+.11*d[i+2];if(lum<150)v|=128>>k}out.push(v)}
      res(out);
    };
    img.src=dataUrl;
  });
}
async function escposSale(s,withLogo){
  const c=cfg(),n=c.paper==="58"?32:48,o=[],raw=(...b)=>o.push(...b),T=x=>o.push(...encText(x)),L=x=>{T(x);raw(10)};
  raw(0x1B,0x40);if(c.enc!=="ascii")raw(0x1B,0x74,19);
  raw(0x1B,0x61,1);
  if(withLogo&&c.logo&&c.prLogo!==false){const r=await rasterLogo(c.logo,c.paper==="58"?256:320);if(r){o.push(...r);raw(10)}}
  raw(0x1B,0x45,1,0x1D,0x21,0x11);wrapTxt(c.name,Math.floor(n/2)).forEach(L);raw(0x1D,0x21,0,0x1B,0x45,0);
  [c.address,c.phone?"Tel. "+c.phone:"",c.ruc?"RUC "+c.ruc:""].filter(Boolean).forEach(x=>wrapTxt(x,n).forEach(L));
  raw(0x1B,0x61,0);L("-".repeat(n));
  raw(0x1B,0x45,1);L("FACTURA "+s.num+(s.status==="anulada"?" (ANULADA)":""));raw(0x1B,0x45,0);
  L(fdate(s.ts));wrapTxt("Cliente: "+s.customer.name,n).forEach(L);if(s.customer.phone)L("Tel: "+s.customer.phone);
  const ri=repInfo(s);if(ri){raw(0x1B,0x45,1);L("Equipo:");raw(0x1B,0x45,0);wrapTxt(ri.device+(ri.imei?" · "+ri.imei:""),n).forEach(L);raw(0x1B,0x45,1);L("Falla reportada:");raw(0x1B,0x45,0);wrapTxt(ri.issue,n).forEach(L)}
  L("-".repeat(n));
  s.items.forEach(l=>{wrapTxt(l.name,n).forEach(L);L(padLR(l.qty+" x "+mny(l.price),mny(l.qty*l.price),n))});
  L("-".repeat(n));L(padLR("Subtotal",mny(s.subtotal),n));
  if(s.discount)L(padLR("Descuento","-"+mny(s.discount),n));if(s.tax)L(padLR("IVA "+s.taxRate+"%",mny(s.tax),n));
  raw(0x1B,0x45,1,0x1D,0x21,0x10);L(padLR("TOTAL",mny(s.total),Math.floor(n/2)));raw(0x1D,0x21,0,0x1B,0x45,0);
  L("Pago: "+s.method);L("-".repeat(n));
  raw(0x1B,0x61,1);wrapTxt(c.footer,n).forEach(L);raw(0x1B,0x45,1);L("Gracias por su compra!");raw(0x1B,0x45,0);
  raw(0x1B,0x64,4);if(c.paper!=="58")raw(0x1D,0x56,66,0);
  return new Uint8Array(o);
}
function escposTest(){
  const n=cfg().paper==="58"?32:48,o=[0x1B,0x40];if(cfg().enc!=="ascii")o.push(0x1B,0x74,19);
  o.push(0x1B,0x61,1,...encText("PRUEBA DE IMPRESION\n"),0x1B,0x61,0,...encText("-".repeat(n)+"\nAcentos: á é í ó ú ñ Ñ ¿? ¡!\nImpresora conectada con Taller Pro.\n"+"-".repeat(n)+"\n"),0x1B,0x64,4);
  return new Uint8Array(o);
}

<script>
const PR={dev:null,chr:null,port:null,type:"",name:""};
const BLE_SVC=["000018f0-0000-1000-8000-00805f9b34fb","0000ff00-0000-1000-8000-00805f9b34fb","0000fff0-0000-1000-8000-00805f9b34fb","0000ffe0-0000-1000-8000-00805f9b34fb","0000ffe5-0000-1000-8000-00805f9b34fb","0000ae30-0000-1000-8000-00805f9b34fb","0000fee7-0000-1000-8000-00805f9b34fb","e7810a71-73ae-499d-8c15-faa9aef0c3f2","49535343-fe7d-4ae5-8fa9-9fafd205e455","00001800-0000-1000-8000-00805f9b34fb"];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const prReady=()=>(PR.type==="ble"&&PR.dev&&PR.dev.gatt.connected&&PR.chr)||(PR.type==="serial"&&PR.port&&PR.port.writable);
const isAndroid=()=>/Android/i.test(navigator.userAgent);
function prUI(){if(view==="aj")render(true)}
async function bleLink(dev){
  const srv=await dev.gatt.connect(),svcs=await srv.getPrimaryServices();let chr=null;
  for(const s of svcs){for(const c of await s.getCharacteristics()){if(c.properties.write||c.properties.writeWithoutResponse){chr=c;break}}if(chr)break}
  if(!chr){try{dev.gatt.disconnect()}catch(e){}throw new Error("Esa impresora no expone un canal de escritura Bluetooth LE. Puede ser un modelo Bluetooth clásico.")}
  PR.dev=dev;PR.chr=chr;PR.type="ble";PR.name=dev.name||"Impresora";
  dev.addEventListener("gattserverdisconnected",()=>{PR.chr=null;prUI()});
  try{localStorage.setItem("tp_printer",PR.name)}catch(e){}
}
async function prConnectBle(){
  if(!navigator.bluetooth)throw new Error("Este navegador no permite Bluetooth. Usa Chrome en Android o PC.");
  const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BLE_SVC});
  await bleLink(dev);
}
async function prConnectSerial(){
  if(!navigator.serial)throw new Error("Este navegador no permite conexión serie/USB. Usa Chrome o Edge en PC.");
  const port=await navigator.serial.requestPort();await port.open({baudRate:+cfg().baud||9600});
  PR.port=port;PR.type="serial";PR.name="Puerto serie / USB";prUI();
}
async function prEnsure(){
  if(prReady())return;
  if(PR.type==="ble"&&PR.dev){await bleLink(PR.dev);return}
  if(navigator.bluetooth)await prConnectBle();else if(navigator.serial)await prConnectSerial();
  else throw new Error("Este navegador no permite conectar impresoras. En Android usa Chrome; en iPhone, el navegador Bluefy.");
}
async function prWrite(bytes){
  if(PR.type==="serial"){const w=PR.port.writable.getWriter();try{await w.write(bytes)}finally{w.releaseLock()}return}
  const nr=PR.chr.properties.writeWithoutResponse&&!PR.chr.properties.write;
  for(let i=0;i<bytes.length;i+=100){const p=bytes.slice(i,i+100);if(nr)await PR.chr.writeValueWithoutResponse(p);else await PR.chr.writeValue(p);await sleep(20)}
}
function b64(bytes){let s="";for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s)}
function rawbt(bytes){location.href="intent:base64,"+b64(bytes)+"#Intent;scheme=rawbt;launchFlags=0x10000000;package=ru.a402d.rawbtprinter;end;"}
async function printBytes(make,quiet){
  try{
    if(cfg().prmethod==="rawbt"){rawbt(await make(false));toast("Enviando a RawBT…");return}
    await prEnsure();await prWrite(await make(true));if(!quiet)toast("Enviado a la impresora");
  }catch(e){
    if(e&&e.name==="NotFoundError")return;
    toast("No se pudo imprimir: "+(e&&e.message?e.message:e)+(PR.type?" Revisa que esté encendida y cerca.":""));
  }
}
const printDirect=(id,quiet)=>S.sales[id]&&printBytes(w=>escposSale(S.sales[id],w),quiet);
const printTest=()=>printBytes(async()=>escposTest());

<script>
/* Nube: Firebase Firestore (tiempo real + funciona sin internet y se pone al día al volver la conexión) */
const CK="tp_cloud",SDK="https://www.gstatic.com/firebasejs/10.12.2/";
const cloudCfg=()=>{try{return JSON.parse(localStorage.getItem(CK)||"null")}catch(e){return null}};
const myDevice=()=>{let d=null;try{d=localStorage.getItem("tp_device");if(!d){d="Equipo-"+Math.random().toString(36).slice(2,6).toUpperCase();localStorage.setItem("tp_device",d)}}catch(e){}return d||"Equipo"};
const mySerie=()=>{try{return localStorage.getItem("tp_serie")||"F"}catch(e){return"F"}};
const repPrefix=()=>mySerie()==="F"?"R":"R"+mySerie();
function nextNum(prefix,col){
  let m=0;const re=new RegExp("^"+prefix+"-(\\d+)$");
  Object.values(S[col]).forEach(x=>{const r=String(x.num||"").match(re);if(r)m=Math.max(m,+r[1])});
  return prefix+"-"+String(m+1).padStart(4,"0");
}
const clean=o=>JSON.parse(JSON.stringify(o));
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("No se pudo cargar Firebase. Se necesita internet la primera vez."));document.head.appendChild(s)})}
let CS={state:"off",msg:""};
async function loadSdk(){if(!window.firebase)for(const f of["app","auth","firestore"])await loadScript(SDK+"firebase-"+f+"-compat.js")}
function parseCfg(txt){
  const m=String(txt).match(/\{[\s\S]*\}/);if(!m)throw new Error("No encontré la configuración de Firebase.");
  let o;try{o=JSON.parse(m[0])}catch(e){o=JSON.parse(m[0].replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,"}"))}
  if(!o.apiKey||!o.projectId)throw new Error("Falta apiKey o projectId en la configuración.");return o;
}
async function initCloud(){
  const c=cloudCfg();CS={state:"loading",msg:""};gate("loading");
  try{
    await loadSdk();
    if(!firebase.apps.length)firebase.initializeApp(c.config);
    const user=await new Promise(res=>{const u=firebase.auth().onAuthStateChanged(x=>{u();res(x)})});
    if(!user){CS={state:"login",msg:""};gate("login");updNet();return}
    const fs=firebase.firestore();
    try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
    DB={collection:n=>fs.collection("negocios/"+c.code+"/"+n),doc:p=>fs.doc("negocios/"+c.code+"/"+p)};FS=true;mode="cloud";
    DB.doc("usuarios/"+user.uid).onSnapshot(async d=>{
      if(!d.exists){
        if(d.metadata.fromCache){if(!useCachedRole(user.uid))gate("offline");return}
        let ow=null;try{ow=await DB.doc("meta/owner").get()}catch(e){}
        if(ow&&!ow.exists)gate("claim");else if(ow)gate("denied");else if(!useCachedRole(user.uid))gate("offline");
        return;
      }
      const u=d.data();
      if(!u.activo){gate("disabled");try{localStorage.removeItem("tp_role")}catch(e){}try{await firebase.auth().signOut()}catch(e){}return}
      applyRole(u,user);
    },()=>{if(!useCachedRole(user.uid))gate("offline")});
  }catch(e){CS={state:"error",msg:e.message||String(e)};gate("offline");updNet()}
}
async function cloudConnect(){
  const g=id=>$("#"+id).value.trim();
  try{
    const config=parseCfg($("#cl_cfg").value),code=(g("cl_code")||"taller").replace(/[^A-Za-z0-9_-]/g,"").slice(0,40)||"taller",email=g("cl_mail"),pass=$("#cl_pass").value;
    if(!email||!pass)throw new Error("Escribe el correo y la contraseña.");
    toast("Conectando…");await loadSdk();
    if(!firebase.apps.length)firebase.initializeApp(config);
    await firebase.auth().signInWithEmailAndPassword(email,pass);
    localStorage.setItem(CK,JSON.stringify({config,code,email}));
    toast("Conectado. Cargando datos…");setTimeout(()=>location.reload(),700);
  }catch(e){
    toast(authMsg(e));
  }
}
async function cloudOff(){
  try{if(window.firebase&&firebase.apps.length)await firebase.auth().signOut()}catch(e){}
  try{localStorage.removeItem(CK);localStorage.removeItem("tp_role")}catch(e){}
  location.reload();
}
async function cloudUp(){
  let src;try{src=JSON.parse(localStorage.getItem("tallerpro")||"null")}catch(e){}
  if(!src||!(Object.keys(src.products||{}).length+Object.keys(src.sales||{}).length+Object.keys(src.repairs||{}).length)){toast("No hay datos locales para subir");return}
  const fs=firebase.firestore();let b=fs.batch(),n=0,tot=0;
  const flush=async()=>{if(n){await b.commit();b=fs.batch();n=0}};
  try{
    toast("Subiendo datos…");
    for(const col of COLS)for(const[id,v]of Object.entries(src[col]||{})){b.set(DB.collection(col).doc(id),clean(v));tot++;if(++n>=400)await flush()}
    if(src.settings){b.set(DB.doc("config/main"),clean(src.settings));n++}
    await flush();toast("Se subieron "+tot+" registros a la nube");
  }catch(e){toast("No se pudo subir: "+(e.code||e.message))}
}
</script>
<script>
function cloudCard(){
  const cc=cloudCfg(),st=CS.state,on=st==="ok";
  const pill=on?`<span class="pill good">Sincronizado en tiempo real</span>`:st==="login"?`<span class="pill warn">Falta iniciar sesión</span>`:st==="loading"?`<span class="pill mut">Conectando…</span>`:st==="error"?`<span class="pill bad">Error</span>`:`<span class="pill mut">No conectada · solo este dispositivo</span>`;
  const dev=`<div class="f" style="margin-top:14px"><div><label for="cl_dev">Nombre de este dispositivo</label><input id="cl_dev" value="${esc(myDevice())}" placeholder="Tienda, Gregory…"></div>

  <p class="note" style="margin:8px 0 0">Cada dispositivo usa su propia serie (ej. A para la tienda, B para tu teléfono) para que las facturas nunca se repitan, incluso sin internet.</p>`;
  const body=cc?`<div class="note" style="margin-top:10px">Negocio: <b>${esc(cc.code)}</b> · Cuenta: <b>${esc(cc.email)}</b>${CS.msg?` · ${esc(CS.msg)}`:""}</div>
  <div class="row" style="margin-top:12px">${on&&isAdmin()?`<button type="button" class="btn" data-act="cloudup">Subir los datos de este dispositivo</button>`:""}<button type="button" class="btn" data-act="gosignout">Cerrar sesión</button>${isAdmin()?`<button type="button" class="btn d" data-act="clouddis">Desconectar de la nube</button>`:""}</div>
  <p class="note" style="margin:10px 0 0">Al conectar, este dispositivo muestra los datos de la nube. Si ya tenías ventas aquí, usa “Subir los datos de este dispositivo” una sola vez, en el primer equipo.</p>`
  :`<div style="margin-top:12px" class="grid"><div><label for="cl_cfg">Configuración de Firebase (pégala completa)</label><textarea id="cl_cfg" rows="4" placeholder="const firebaseConfig = { apiKey: &quot;…&quot;, projectId: &quot;…&quot;, … }"></textarea></div>
  <div class="f"><div><label for="cl_code">Código del negocio</label><input id="cl_code" value="taller"></div><div><label for="cl_mail">Correo de la cuenta</label><input id="cl_mail" type="email" autocomplete="username"></div><div><label for="cl_pass">Contraseña</label><input id="cl_pass" type="password" autocomplete="current-password"></div></div>
  <div class="row"><button type="button" class="btn p" data-act="cloudgo">Conectar a la nube</button></div></div>`;
  return `<div class="card" style="margin-top:14px"><h2>Sincronización entre dispositivos</h2>
  <p class="note" style="margin:0 0 10px">Conecta la tienda y tu teléfono al mismo negocio: cada venta aparece en todos al instante, y el inventario se descuenta en todos. Sin internet sigue funcionando y se pone al día al volver la conexión.</p>${pill}${dev}${body}</div>`;
}
</script>

    else toast("Nueva versión lista. Se aplicará al reabrir la app.");
  });
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update();setInterval(()=>r.update(),1800000)}).catch(()=>{}));
}
</script>
